services:
  java:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../java.env
    volumes:
      - estado_java:/estado
    stop_grace_period: 45s
    logging:
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  estado_java:
    name: streamguard_estado_java

networks:
  default:
    external: true
    name: streamguard_default
